<!-- Ảnh giữ chỗ cho tệp đính kèm của case thuê trọ: kẻ gian gửi "ảnh chụp căn
     cước và sổ hồng" để tạo lòng tin. Vẽ bằng SVG chứ không dùng ảnh thật vì
     giấy tờ tuỳ thân thật không được đưa vào dự án, và mẫu giấy chứng nhận thật
     cũng không được sao chép (quy tắc 10) — chỉ giữ đúng bố cục.
     Hai cụm người chơi phải soi được nằm sẵn ở đây: con dấu nhoè lệch màu
     (sp_img_01) và tấm căn cước trông rất thật (sp_img_02, cụm mồi). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img"
     aria-label="Ảnh chụp căn cước công dân và giấy chứng nhận quyền sở hữu nhà ở">
  <defs>
    <!-- Dấu nhoè: kẻ gian in lại từ bản chụp nên vành dấu mất nét -->
    <filter id="nhoe"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- Mặt bàn, ảnh chụp bằng điện thoại nên nền tối và hơi bẩn -->
  <rect width="640" height="420" fill="#5f5952"/>
  <rect x="0" y="0" width="640" height="420" fill="#000" opacity="0.06"/>

  <!-- Giấy chứng nhận quyền sở hữu nhà, nằm dưới, hơi nghiêng -->
  <g transform="rotate(-3 330 200)">
    <rect x="120" y="34" width="420" height="330" rx="3" fill="#efe4cd" stroke="#d6c7a8"/>
    <text x="330" y="76" text-anchor="middle" font-family="serif" font-size="15"
          letter-spacing="1" fill="#8a2f2f">GIẤY CHỨNG NHẬN</text>
    <text x="330" y="96" text-anchor="middle" font-family="serif" font-size="11"
          fill="#8a2f2f">QUYỀN SỞ HỮU NHÀ Ở</text>
    <line x1="250" y1="106" x2="410" y2="106" stroke="#c2ab84"/>

    <!-- Dòng chữ nội dung, chỉ gợi hình chứ không đọc được -->
    <g fill="#a2966f" opacity="0.75">
      <rect x="152" y="128" width="356" height="5" rx="2"/>
      <rect x="152" y="144" width="330" height="5" rx="2"/>
      <rect x="152" y="160" width="356" height="5" rx="2"/>
      <rect x="152" y="176" width="212" height="5" rx="2"/>
      <rect x="152" y="204" width="356" height="5" rx="2"/>
      <rect x="152" y="220" width="290" height="5" rx="2"/>
      <rect x="152" y="236" width="340" height="5" rx="2"/>
    </g>

    <!-- sp_img_01 — con dấu: lệch màu, nhoè nét, vành dấu không đều -->
    <g filter="url(#nhoe)" opacity="0.72" transform="rotate(-11 430 300)">
      <circle cx="430" cy="300" r="46" fill="none" stroke="#4a5fa8" stroke-width="4"/>
      <circle cx="430" cy="300" r="37" fill="none" stroke="#6a4aa8" stroke-width="2.4"/>
      <path d="M430 276 l7 15 16 2 -12 12 3 16 -14-8 -14 8 3-16 -12-12 16-2z" fill="#4a5fa8"/>
      <text x="430" y="340" text-anchor="middle" font-family="serif" font-size="8"
            fill="#4a5fa8">CƠ QUAN CẤP</text>
    </g>
    <!-- Chữ ký tay bên cạnh dấu -->
    <path d="M356 316 c14-18 22 10 34-6 c10-13 16 12 30 0" fill="none"
          stroke="#2f3a63" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- sp_img_02 — thẻ căn cước, đặt chồng lên, trông rất thật (cụm mồi) -->
  <g transform="rotate(5 190 300)">
    <rect x="46" y="228" width="290" height="176" rx="10" fill="#dfe6ec" stroke="#b9c5d0"/>
    <rect x="46" y="228" width="290" height="34" rx="10" fill="#c9d6e2"/>
    <text x="191" y="250" text-anchor="middle" font-family="sans-serif" font-size="10"
          letter-spacing="1.2" fill="#3d5166">CĂN CƯỚC CÔNG DÂN</text>

    <!-- Ảnh chân dung -->
    <rect x="62" y="276" width="76" height="96" rx="4" fill="#aab8c4"/>
    <circle cx="100" cy="308" r="19" fill="#8fa0af"/>
    <path d="M70 372 c6-24 54-24 60 0z" fill="#8fa0af"/>

    <g fill="#5a6c7d">
      <rect x="152" y="280" width="168" height="7" rx="3"/>
      <rect x="152" y="298" width="140" height="6" rx="3" opacity="0.75"/>
      <rect x="152" y="314" width="156" height="6" rx="3" opacity="0.75"/>
      <rect x="152" y="330" width="118" height="6" rx="3" opacity="0.75"/>
    </g>
    <!-- Dãy số máy đọc ở đáy thẻ -->
    <g fill="#7d8b98" opacity="0.7">
      <rect x="62" y="384" width="258" height="5" rx="2"/>
    </g>
  </g>

  <!-- Nhãn góc: nói rõ đây là ảnh giữ chỗ, để không ai nhầm là tư liệu thật -->
  <text x="628" y="410" text-anchor="end" font-family="sans-serif" font-size="9"
        fill="#ffffff" opacity="0.45">ảnh giữ chỗ · nội dung hư cấu</text>
</svg>
