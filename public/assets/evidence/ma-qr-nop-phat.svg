<!-- Ảnh giữ chỗ cho tệp đính kèm của case tài xế bị "phạt nguội": kẻ gian gửi
     mã QR để người chơi quét mà chuyển tiền.
     Các ô đen là hình vẽ tay, KHÔNG phải mã QR hợp lệ — cố ý, để không ai quét
     trúng thứ gì. Cụm sp_img_01 là dòng tên tài khoản dưới mã: tên cá nhân đội
     lốt bộ phận hỗ trợ, đây mới là chỗ người chơi phải soi.
     Tên hãng là hư cấu (quy tắc 10), logo cổng thanh toán chỉ vẽ khối màu. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" role="img"
     aria-label="Ảnh mã QR thanh toán kèm logo các cổng thanh toán">
  <rect width="460" height="560" fill="#f2f3f5"/>

  <!-- Phiếu thanh toán -->
  <rect x="30" y="26" width="400" height="508" rx="12" fill="#ffffff" stroke="#dcdfe4"/>

  <!-- Đầu phiếu -->
  <rect x="30" y="26" width="400" height="66" rx="12" fill="#e8edf3"/>
  <rect x="30" y="74" width="400" height="18" fill="#e8edf3"/>
  <circle cx="66" cy="59" r="15" fill="#9fb2c6"/>
  <text x="94" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#3c4a5a">ZipBike</text>
  <text x="94" y="72" font-family="sans-serif" font-size="10" fill="#7b8a9a">Thanh toán xử phạt</text>

  <text x="230" y="126" text-anchor="middle" font-family="sans-serif" font-size="12"
        fill="#6b7784">Quét mã để nộp phạt</text>

  <!-- Khung mã QR. Các ô là hình vẽ, không mã hoá dữ liệu nào. -->
  <rect x="130" y="146" width="200" height="200" fill="#ffffff" stroke="#c9ced6"/>
  <g fill="#20242a">
    <!-- Ba ô định vị ở ba góc -->
    <path d="M144 160h44v44h-44z M152 168h28v28h-28z" fill-rule="evenodd"/>
    <rect x="158" y="174" width="16" height="16"/>
    <path d="M272 160h44v44h-44z M280 168h28v28h-28z" fill-rule="evenodd"/>
    <rect x="286" y="174" width="16" height="16"/>
    <path d="M144 288h44v44h-44z M152 296h28v28h-28z" fill-rule="evenodd"/>
    <rect x="158" y="302" width="16" height="16"/>

    <!-- Vùng dữ liệu giả -->
    <rect x="200" y="160" width="8" height="8"/><rect x="216" y="160" width="8" height="8"/>
    <rect x="240" y="160" width="8" height="8"/><rect x="208" y="176" width="8" height="8"/>
    <rect x="232" y="176" width="8" height="8"/><rect x="248" y="176" width="8" height="8"/>
    <rect x="200" y="192" width="8" height="8"/><rect x="224" y="192" width="8" height="8"/>
    <rect x="256" y="192" width="8" height="8"/><rect x="216" y="208" width="8" height="8"/>
    <rect x="240" y="208" width="8" height="8"/><rect x="264" y="208" width="8" height="8"/>
    <rect x="144" y="224" width="8" height="8"/><rect x="168" y="224" width="8" height="8"/>
    <rect x="192" y="224" width="8" height="8"/><rect x="208" y="224" width="8" height="8"/>
    <rect x="232" y="224" width="8" height="8"/><rect x="272" y="224" width="8" height="8"/>
    <rect x="296" y="224" width="8" height="8"/><rect x="152" y="240" width="8" height="8"/>
    <rect x="184" y="240" width="8" height="8"/><rect x="216" y="240" width="8" height="8"/>
    <rect x="248" y="240" width="8" height="8"/><rect x="280" y="240" width="8" height="8"/>
    <rect x="304" y="240" width="8" height="8"/><rect x="160" y="256" width="8" height="8"/>
    <rect x="200" y="256" width="8" height="8"/><rect x="240" y="256" width="8" height="8"/>
    <rect x="264" y="256" width="8" height="8"/><rect x="296" y="256" width="8" height="8"/>
    <rect x="144" y="272" width="8" height="8"/><rect x="176" y="272" width="8" height="8"/>
    <rect x="224" y="272" width="8" height="8"/><rect x="256" y="272" width="8" height="8"/>
    <rect x="288" y="272" width="8" height="8"/><rect x="200" y="288" width="8" height="8"/>
    <rect x="232" y="288" width="8" height="8"/><rect x="272" y="288" width="8" height="8"/>
    <rect x="304" y="288" width="8" height="8"/><rect x="208" y="304" width="8" height="8"/>
    <rect x="248" y="304" width="8" height="8"/><rect x="280" y="304" width="8" height="8"/>
    <rect x="192" y="320" width="8" height="8"/><rect x="224" y="320" width="8" height="8"/>
    <rect x="264" y="320" width="8" height="8"/><rect x="296" y="320" width="8" height="8"/>
  </g>

  <!-- sp_img_01 — tên tài khoản nhận tiền, dòng đáng soi nhất trong ảnh -->
  <text x="230" y="380" text-anchor="middle" font-family="sans-serif" font-size="13"
        font-weight="600" fill="#2c3440">NHAN VIEN HO TRO ZIPBIKE</text>
  <text x="230" y="402" text-anchor="middle" font-family="sans-serif" font-size="12"
        fill="#6b7784">Số tiền: 500.000đ</text>

  <line x1="62" y1="428" x2="398" y2="428" stroke="#e4e7eb"/>

  <!-- Dãy logo cổng thanh toán, vẽ khối màu chứ không mượn nhãn hiệu thật -->
  <text x="230" y="452" text-anchor="middle" font-family="sans-serif" font-size="10"
        fill="#8b96a3">Hỗ trợ các ứng dụng ngân hàng</text>
  <g>
    <rect x="98" y="466" width="52" height="34" rx="8" fill="#dbe6f2"/>
    <circle cx="124" cy="483" r="9" fill="#94b0cd"/>
    <rect x="164" y="466" width="52" height="34" rx="8" fill="#e5dcf1"/>
    <rect x="181" y="475" width="18" height="16" rx="4" fill="#a894c9"/>
    <rect x="230" y="466" width="52" height="34" rx="8" fill="#dcefe2"/>
    <path d="M247 491 l9-16 9 16z" fill="#8fbfa0"/>
    <rect x="296" y="466" width="52" height="34" rx="8" fill="#f1e6d8"/>
    <rect x="313" y="475" width="18" height="16" rx="8" fill="#cbab84"/>
  </g>

  <text x="230" y="524" text-anchor="middle" font-family="sans-serif" font-size="9"
        fill="#aab3bd">ảnh giữ chỗ · nội dung hư cấu · mã không quét được</text>
</svg>
