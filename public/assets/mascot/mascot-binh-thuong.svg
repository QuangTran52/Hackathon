<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Mascot giữ chỗ">
  <!-- Bản giữ chỗ, thay bằng mascot-binh-thuong.png khi bên thiết kế bàn giao.
       Chỉ dùng họ tím theo Design Spec, tuyệt đối không dùng xanh lá. -->
  <g fill="none" stroke="#4B4173" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- thân -->
    <path d="M52 168v-26a38 38 0 0 1 76 0v26" fill="#8B7BC7"/>
    <!-- tay -->
    <path d="M52 150h-9a9 9 0 0 1 0-18h9" fill="#8B7BC7"/>
    <path d="M128 150h9a9 9 0 0 0 0-18h-9" fill="#8B7BC7"/>
    <!-- đầu -->
    <rect x="42" y="34" width="96" height="80" rx="30" fill="#8B7BC7"/>
    <!-- ăng ten -->
    <path d="M90 34V18"/>
    <circle cx="90" cy="13" r="6" fill="#F4F2FA"/>
    <!-- mắt, tách lớp để về sau animate được -->
    <g id="mat">
      <circle cx="70" cy="70" r="7" fill="#4B4173" stroke="none"/>
      <circle cx="110" cy="70" r="7" fill="#4B4173" stroke="none"/>
    </g>
    <!-- miệng -->
    <g id="mieng">
      <path d="M78 92c4 5 20 5 24 0"/>
    </g>
  </g>
</svg>
